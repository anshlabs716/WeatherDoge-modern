def gitRev = {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    }
    catch (ignored) {
        return 'nogit'
    }
}

Closure<String[]> getVersionDef = {
    new File('WeatherDoge/versionDef.txt').text.trim().split('\\r?\\n')
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 36
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        applicationId "com.versobit.weatherdoge"
        versionCode getVersionDef()[0].toInteger()
        versionName getVersionDef()[1]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Providers and the forecast strip use java.time; desugaring keeps that working
        // all the way down to minSdk 21 instead of crashing on Android 8.0.
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    // Release signing lives in a git-ignored properties file. Forks and CI without it
    // still build, they just produce an unsigned release APK.
    def keystorePropsFile = rootProject.file('local-extras/keystore.properties')
    def keystoreProps = new Properties()
    def hasReleaseKeystore = keystorePropsFile.exists()
    if (hasReleaseKeystore) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    namespace 'com.versobit.weatherdoge'
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation project(':LeonidsLib')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.getbase:floatingactionbutton:1.10.0'

    def work_version = '2.10.0'
    implementation "androidx.work:work-runtime:$work_version"
    implementation "androidx.work:work-runtime-ktx:$work_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}

// Local, never-committed media overrides. Files in local-extras/ (git-ignored) replace the
// corresponding original synthesized sound in assets/sounds/ for local builds only.
// This keeps copyrighted material out of the repository while letting the developer
// build a personal APK with their own media. See local-extras/README.txt.
def localExtrasDir = project.rootProject.file('local-extras')
def localExtrasOut = project.layout.buildDirectory.dir("localExtrasAssets/sounds").get().asFile
android.sourceSets.main.assets.srcDir(localExtrasOut.parentFile)
tasks.register('copyLocalExtras', Copy) {
    from localExtrasDir
    include '*.mp3', '*.aac', '*.m4a', '*.ogg', '*.wav', '*.mp4'
    into localExtrasOut
}
tasks.named('preBuild').configure { dependsOn 'copyLocalExtras' }

// Optional developer credentials. Open-Meteo (the default provider) needs no key.
// OpenWeatherMap/AccuWeather keys may be provided locally for convenience; users can
// also enter their own OWM key in the app settings. Keys must never be committed.
Properties localProps = new Properties()
File localPropsFile = project.rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}
android.defaultConfig.buildConfigField 'String', 'OWM_APPID', '"' + (localProps.getProperty('owm.appid') ?: '') + '"'
android.defaultConfig.buildConfigField 'String', 'ACCUWEATHER_KEY', '"' + (localProps.getProperty('accuweather.key') ?: '') + '"'
android.defaultConfig.buildConfigField 'String', 'FLAVOR', '"FOSS"'
android.defaultConfig.buildConfigField 'String', 'FLAVOR_FOSS', '"FOSS"'
android.defaultConfig.buildConfigField 'String', 'FLAVOR_PLAY', '"PLAY"'

kotlin {
    jvmToolchain 17
}
